<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Our Rush Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="d-flex flex-column align-items-center justify-content-center text-white text-center vh-100 m-0 overflow-hidden">

    <!-- วิดีโอพื้นหลังเหมือนเดิม -->
    <video autoplay loop muted playsinline class="video-bg">
        <source src="sea.mp4" type="video/mp4">
    </video>

    <!-- เปลี่ยนจากข้อความลอยๆ เป็นกล่องกระจกฝ้า (Glassmorphism) -->
    <!-- ใส่พื้นหลังสีดำโปร่งแสง 25% (rgba) และใช้ backdrop-filter สั่งเบลอพื้นหลัง -->
    <div class="content-overlay container p-5 rounded-5" style="background: rgba(0, 0, 0, 0.25); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.2); max-width: 800px; box-shadow: 0 15px 35px rgba(0,0,0,0.2);">
        
        <!-- ปรับหัวข้อให้ดูคลีนขึ้น เอาคำสั่ง -webkit-text-stroke ออก และใช้เงาฟุ้งๆ (text-shadow) แทน -->
        <!-- เพิ่ม letter-spacing เล็กน้อยให้ตัวหนังสือดูโปร่งและแพงขึ้น -->
        <h1 class="display-3 fw-bolder mb-4" style="color: #FFFFFF; text-shadow: 0 4px 15px rgba(0,0,0,0.5); letter-spacing: 2px;">
            Welcome to Our Rush Project
        </h1>

        <!-- เปลี่ยนสีตัวหนังสือย่อยจากสีแดง/ดำ เป็นสีขาว/เทาอ่อน เพื่อให้เข้ากับธีมทะเล และอ่านง่ายขึ้น -->
        <h3 class="mb-5 fw-light" style="color: #F8F9FA; text-shadow: 0 2px 10px rgba(0,0,0,0.5);">
            Select whose portfolio you want to view:
        </h3>

        <div class="d-flex flex-wrap gap-4 justify-content-center">
            
            <!-- เพิ่มลูกเล่น (Hover Effect) ให้ปุ่ม โดยใช้ inline CSS: เวลาเอาเมาส์ชี้ ปุ่มจะขยายขนาดขึ้นนิดนึง (scale 1.05) -->
            <a href="fah.html" class="btn btn-lg rounded-pill px-5 py-3 fw-bold shadow-lg" style="background-color: #C49A45; color: #fff; transition: transform 0.3s ease;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">FAH</a>
            
            <a href="focus.html" class="btn btn-lg rounded-pill px-5 py-3 fw-bold shadow-lg" style="background-color: #123F36; color: #fff; transition: transform 0.3s ease;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">FOCUS</a>
            
        </div>
        
    </div>

</body>
</html>
