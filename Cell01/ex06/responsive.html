<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Table</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }
        table {
            width: 100%;
            height: 100%;
            text-align: center;
            border-collapse: collapse;
        }
        td {
            width: 50%;
        }
    </style>
</head>
<body>
    
    <table border="1">
        <tr>
            <td style="background-color: rgb(194, 203, 141);">
                First cell
            </td>
            <td style="background-color: rgb(246, 199, 183);">
                Second cell
            </td>
        </tr>
    </table>
</body>
</html>
