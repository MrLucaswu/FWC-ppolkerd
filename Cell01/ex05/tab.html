<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab</title>
</head>
<body>
    
    <!-- สร้างตารางพร้อมกำหนดความกว้างและเส้นขอบให้เห็นชัดเจน -->
    <table border="1" style="width: 50%; text-align: center;">
        <tr>
            <!-- ช่องที่ 1: ใส่สีและข้อความ -->
            <td style="background-color: lightblue; padding: 30px;">
                Engineering Student
            </td>
            
            <!-- ช่องที่ 2: ใส่สีและข้อความ -->
            <td style="background-color: lightcoral; padding: 30px;">
                One Piece Live Action
            </td>
        </tr>
    </table>

</body>
</html>
