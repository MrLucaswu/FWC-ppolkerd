<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>
    <div class="profile-card">
        <div class="card-header">
            <h2>User Profile Card</h2>
        </div>
        <img src="FOCUS.JPG" alt="Profile Picture" class="profile-pic">
        <table class="invisible-table">
            <tr>
                <td class="login-name">ppolkerd</td>
            </tr>
            <tr>
                <td class="description">Engineering Student</td>
            </tr>
        </table>
        
        <!-- ส่วนของไอคอน Social Media ที่แก้ให้คลิกได้ -->
        <div class="social-icons">
            
            <!-- ไอคอน Facebook: ใช้ target="_blank" เพื่อให้เวลาคลิกเปิดแท็บใหม่ -->
            <a href="https://www.facebook.com/phut.hi.meth.phl.keid" target="_blank">
                <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="Facebook">
            </a>
            
            <!-- ไอคอน Instagram -->
            <a href="https://www.instagram.com/puttimate_polkerd" target="_blank">
                <img src="https://cdn-icons-png.flaticon.com/512/733/733558.png" alt="Instagram">
            </a>
            
            <!-- ไอคอน Email (แทน Twitter): ใช้คำสั่ง mailto: ตามด้วยอีเมลปลายทาง -->
            <a href="mailto:68011768@kmitl.ac.th">
                <!-- URL รูปภาพด้านล่างนี้ผมเปลี่ยนเป็นไอคอนซองจดหมาย (Email) ให้แล้วครับ -->
                <img src="https://cdn-icons-png.flaticon.com/512/732/732200.png" alt="Email">
            </a>
            
        </div>
        
        <button class="contact-btn">Contact</button>
    </div>
</body>
</html>
